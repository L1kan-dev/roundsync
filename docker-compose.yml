services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - VALVE_API_KEY=${VALVE_API_KEY}
      - FRONTEND_URL=http://localhost:3000
    restart: unless-stopped

  watcher:
    build:
      context: ./services/watcher
      dockerfile: Dockerfile
    environment:
      - VALVE_API_KEY=${VALVE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    restart: unless-stopped

  gc-worker:
    build:
      context: ./services/gc-worker
      dockerfile: Dockerfile
    environment:
      - STEAM_USERNAME=${STEAM_USERNAME}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      - STEAM_SHARED_SECRET=${STEAM_SHARED_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* variables get compiled into the client bundle at BUILD time, not
      # read at container startup — the `environment:` block below has zero effect on
      # them. Railway passes its own env vars as build args automatically (confirmed via
      # Railway's own docs), but plain docker-compose does not; without these, a locally
      # built frontend silently ignores any custom API URL and falls back to the
      # hardcoded localhost default in the code instead.
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
        - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - api
    restart: unless-stopped
